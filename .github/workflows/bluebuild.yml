name: BlueBuild

on:
  push:
    branches: [main]
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: blue-build/github-action@fb86c457fd3d0e13d5e9c1875c6305cf28b09234 # v1.14.0
        with:
          registry_token: ${{ github.token }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          chunkah: true
